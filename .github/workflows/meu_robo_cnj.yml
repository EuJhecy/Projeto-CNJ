name: Executar Robô CNJ

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * *' # Roda o robô todo dia às 3h da manhâ (horário de bsb)

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Permite rodar até 6 horas sem ser cancelado

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: |
          pip install requests duckdb

      - name: Rodar o script Python
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          PYTHONUNBUFFERED: "1" # Força os prints a aparecerem na hora no terminal
        run: |
          python -u robo_python_2_arq.py
