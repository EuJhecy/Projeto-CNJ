name: Executar Robô CNJ

on:
  workflow_dispatch: # Permite rodar manualmente pelo botão "Run workflow"
  # schedule:
  #   - cron: '0 6 * * *' # roda todo dia às 03h da manhã - horário de Brasília

jobs:
  executar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: |
          pip install requests duckdb

      - name: Rodar o script Python
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.TOKEN_MOTHERDUCK }}
        run: |
          python robo_python_2_arq.py
